<!DOCTYPE html>
<html>

<head>
<title>For You ❤️</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
text-align:center;
font-family:Arial;
background:linear-gradient(135deg,#ff9a9e,#fad0c4);
height:100vh;
margin-top:80px;
}

img{
width:300px;
border-radius:20px;
box-shadow:0 10px 20px rgba(0,0,0,0.3);
}

button{
font-size:18px;
padding:10px 20px;
margin:10px;
border:none;
border-radius:10px;
cursor:pointer;
}

#yesBtn{
background:#28a745;
color:white;
}

#noBtn{
background:#dc3545;
color:white;
position:absolute;
}

</style>

</head>

<body>

<h1>Will you be my Valentine? ❤️</h1>

<img src="love.jpeg">

<br><br>

<button id="yesBtn">Yes</button>
<button id="noBtn">No</button>

<audio id="song" loop>
<source src="music.mp3" type="audio/mp3">
</audio>

<script>

let yesSize = 18;

const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");

function moveNo(){

yesSize += 8;

yesBtn.style.fontSize = yesSize + "px";

noBtn.style.left = Math.random()*window.innerWidth+"px";
noBtn.style.top = Math.random()*window.innerHeight+"px";

}

noBtn.onmouseover = moveNo;
noBtn.ontouchstart = moveNo;

yesBtn.onclick = function(){

document.getElementById("song").play();

let today = new Date().toDateString();

document.body.innerHTML =

"<h1>အရမ်းချစ်တယ် ❤️</h1>" +

"<h2>"+today+"</h2>" +

"<p style='font-size:20px;max-width:600px;margin:auto;'>"

+ "From the moment you came into my life, everything became brighter. "

+ "You are the peace in my heart and the happiness in my days."

+ "<br><br>"

+ "ခုကမ္ဘာကြီးမှာ အသက်ရှင်ရတာ မထူးရတဲ့ထဲ "

+ "မင်းကိုသာ ဆုံးရှုံးရရင် ရူးရချည်ရဲ့ကွယ်"

+ "</p>";

}

</script>

</body>
</html>
