<!DOCTYPE html>
<html>
<head>
<title>For You ❤️</title>
</head>

<body style="text-align:center;font-family:Arial;background:pink;">

<h1>Will you be my Valentine? ❤️</h1>

<img src="photo.jpg" width="300">

<br><br>

<button id="yesBtn" onclick="yes()">Yes</button>
<button id="noBtn">No</button>
    
<audio autoplay loop>
<source src="music.mp3" type="audio/mp3">
</audio>
    
<script>

let yesSize = 18;

const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");

noBtn.onmouseover = function(){

    yesSize += 10;

    yesBtn.style.fontSize = yesSize + "px";
    yesBtn.style.padding = "10px 20px";

    this.style.position = "absolute";
    this.style.left = Math.random()*window.innerWidth + "px";
    this.style.top = Math.random()*window.innerHeight + "px";
}

function yes(){

document.body.innerHTML =
"<h1>အရမ်းချစ်တယ် ❤️</h1>" +
"<h2>"+ new Date().toDateString() +"</h2>" +
"<p>In this huge world, living doesn't feel special… but losing you would make me lose my mind. I love you deeply.</p>";

}

</script>

</body>
</html>
