<!DOCTYPE html>
<html>

<head>

<title>For You ❤️</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>

<body style="text-align:center;font-family:Arial;background:pink;">

<h1>Will you be my Valentine? ❤️</h1>

<img src="love.jpg" width="300" style="border-radius:15px;">

<br><br>

<button id="yesBtn" onclick="yes()">Yes</button>
<button id="noBtn">No</button>

<audio id="song" loop>
<source src="music.mp3" type="audio/mp3">
</audio>

<script>

let yesSize = 18;

const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");

function moveNo(){

yesSize += 10;

yesBtn.style.fontSize = yesSize + "px";
yesBtn.style.padding = "10px 20px";

noBtn.style.position="absolute";
noBtn.style.left=Math.random()*window.innerWidth+"px";
noBtn.style.top=Math.random()*window.innerHeight+"px";

}

noBtn.onmouseover = moveNo;
noBtn.ontouchstart = moveNo;

function yes(){

document.getElementById("song").play();

let today = new Date().toDateString();

document.body.innerHTML =

"<h1>အရမ်းချစ်တယ် ❤️</h1>" +

"<h2>"+ today +"</h2>" +

"<p style='max-width:500px;margin:auto;font-size:20px;'>"

+ "In this huge world, living doesn't feel special… but losing you would make me lose my mind."

+ "<br><br>"

+ "</p>";

}

</script>

</body>

</html>
